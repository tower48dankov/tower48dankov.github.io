<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a10">
<title>Кафе «Башня» — Данков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--honey:#f4bf6a;--ink:#fff8ef;--soft:rgba(255,248,239,.72);--glass:rgba(255,248,239,.13);--glass-hi:rgba(255,248,239,.22);--edge:rgba(255,248,239,.24)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:#2a1a10;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bg{position:fixed;inset:0;z-index:-1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;background:#2a1a10}
.bg i{background-size:cover;background-position:center;transform:scale(1.15)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(32,19,10,.55),rgba(32,19,10,.72))}
main{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;padding:44px 22px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{width:132px;height:132px;display:grid;place-items:center;margin-bottom:22px}
.logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,.35))}
.logo .fallback{display:none;width:112px;height:112px;border-radius:50%;background:var(--glass-hi);border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);place-items:center}
.logo .fallback svg{width:58px;height:58px}
h1{font-family:'Unbounded',system-ui,sans-serif;font-weight:600;font-size:clamp(2rem,9vw,2.6rem);letter-spacing:-.01em;line-height:1.1;text-align:center}
.sub{margin-top:10px;color:var(--soft);font-size:1.02rem;text-align:center}
.links{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:12px}
.link{display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:24px;color:var(--ink);text-decoration:none;
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);
  transition:background .2s,transform .2s;-webkit-tap-highlight-color:transparent}
.link:hover{background:var(--glass-hi)}
.link:active{transform:scale(.98)}
.link:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
.ico{flex:none;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:1.05rem}
.vk{background:#2787f5}.ym{background:#fc3f1d}.dg{background:#2fa42f}
.ico svg{width:28px;height:28px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:1.1rem;font-weight:600}
.txt span{display:block;margin-top:2px;font-size:.92rem;color:var(--soft)}
.chev{flex:none;width:20px;height:20px;color:var(--honey)}
.hours{margin-top:26px;padding:11px 22px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:.97rem;font-weight:500}
.hours b{color:var(--honey);font-weight:600}
.thanks{margin-top:22px;color:var(--soft);font-size:.93rem;text-align:center;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
